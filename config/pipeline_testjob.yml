# run in debug mode?
debug: True

# are we running this locally ("local") or on Nomad ("nomad")?
run_on: nomad

# Settings for sample numbers and negative controls
sample_number_settings:
  # specify the format for sample numbers used in the input runsheet as a regex
  sample_number_format: '([BDFT]|[135]0|11)([0-9]{8}|[0-9]{6})-\d' # TODO: what is the format for sample numbers - probably numbers?
  format_in_sheet: '(?P<sample_type>[BDFT]|[1357]0|11)(?P<sample_number>\d{6})(?P<sample_year>\d{2})?(?P<bact_number>-\d)?'
  format_in_lis: '(?P<sample_type>[BDFT])(?P<sample_year>\d{2})(?P<sample_number>\d{6})'
  format_output: '(?P<sample_type>[BDFT]|[1357]0|11)(?P<sample_year>\d{2})(?P<sample_number>\d{6})(?P<bact_number>-\d)?'
  # optional conversion between sample numbers starting with numbers vs letters (allowed values: number, letter)
  # if your sample numbers don't need conversion, set _in and _out to be the same - TODO: extra logic on switching
  sample_numbers_in: number
  sample_numbers_out: letter
  sample_numbers_output: number
  # mapping between sample number/letter if needed
  number_to_letter: { "70": "P", "30": "B", "10": "D", "11": "F", "50": "T"}
  negative_control: 'NegK[a-zA-Z0-9_-]*' # TODO: do we have negative controls?
  # list of positive controls - TODO: do we have them?
  positive_control: {"PosK": ""}

# Settings for laboratory information system - currently only OUH's MADS setup is fully implemented
lab_info_system:
  # can choose to use features depending on a laboratory information system
  use_lis_features: True
  lis_report: "/data/test_data/16S/test_data/fake_mads_indikation.txt"

barcode_format: "RB[0-9]{2}" # format of barcodes in runsheet
barcode_prefix: "RB" # barcode prefix as letter (for transferring original fastqs by barcode)

# what are we looking at? 16S, 18S, something else?
amplicon_type: 16S

# how long should the pipeline wait for the summary file?
seq_run_duration_hours: 1
check_interval_seconds: 30

paths:
  output_base_path: "/data/test_data/16S/pipeline_test"

# quality settings - expected minimum and maximum length and average Q score
quality_params:
  min_length: 700
  max_length: 1600
  min_qscore: 15

databases:
  emu_db: /path/to/emu_db
  human_reads: /path/to/human_reads

cores: 128
conda:
  use_conda: True
  frontend: ""
  prefix: ""